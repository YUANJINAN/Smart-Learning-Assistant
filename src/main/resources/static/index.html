<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人工智能多智能体学习助手</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="app-header">
    <div>
        <p class="eyebrow">Smart Learning Assistant</p>
        <h1>人工智能多智能体学习助手</h1>
    </div>
    <nav>
        <a href="#learner">学习者</a>
        <a href="#courses">智能教学</a>
        <a href="#plans">计划复习</a>
        <a href="#admin">后台管理</a>
    </nav>
</header>

<main>
    <section class="login-strip">
        <label>当前账号
            <select id="loginUser">
                <option value="learner">示例学习者</option>
                <option value="admin">系统管理员</option>
            </select>
        </label>
        <button id="loginBtn">登录</button>
        <strong id="currentUserLabel">未登录</strong>
    </section>

    <section class="summary-grid" id="admin">
        <article><span>用户数</span><strong id="userCount">0</strong></article>
        <article><span>课程数</span><strong id="courseCount">0</strong></article>
        <article><span>练习数</span><strong id="exerciseCount">0</strong></article>
        <article><span>计划数</span><strong id="planCount">0</strong></article>
    </section>

    <section class="workspace">
        <div class="panel" id="learner">
            <div class="panel-title">
                <h2>学习档案</h2>
                <button id="saveProfileBtn">保存</button>
            </div>
            <label>学习目标 <input id="goalInput" type="text"></label>
            <label>当前水平 <input id="levelInput" type="text"></label>
            <label>兴趣方向 <input id="interestsInput" type="text" placeholder="用逗号分隔"></label>
            <label>薄弱点 <input id="weakPointsInput" type="text" placeholder="用逗号分隔"></label>
            <label>每日学习分钟 <input id="dailyTargetInput" type="number" min="10" max="240"></label>
        </div>

        <div class="panel">
            <div class="panel-title">
                <h2>学习进度</h2>
                <button id="refreshProgressBtn">刷新</button>
            </div>
            <div id="progressBox" class="metric-box"></div>
            <div id="mistakeList" class="list compact"></div>
        </div>
    </section>

    <section class="workspace">
        <div class="panel" id="courses">
            <div class="panel-title">
                <h2>课程与练习</h2>
                <select id="courseFilter"></select>
            </div>
            <div class="admin-form">
                <input id="courseTitleInput" type="text" placeholder="课程名称">
                <input id="courseSubjectInput" type="text" placeholder="学科方向">
                <input id="courseDifficultyInput" type="text" placeholder="难度">
                <input id="courseObjectivesInput" type="text" placeholder="课程目标，逗号分隔">
                <textarea id="courseSummaryInput" rows="2" placeholder="课程简介"></textarea>
                <button id="saveCourseBtn">新增课程</button>
            </div>
            <div id="courseList" class="list"></div>
            <div class="admin-form">
                <select id="exerciseCourseInput"></select>
                <input id="exerciseQuestionInput" type="text" placeholder="练习题目">
                <input id="exerciseOptionsInput" type="text" placeholder="选项，逗号分隔">
                <input id="exerciseAnswerInput" type="text" placeholder="正确答案">
                <textarea id="exerciseExplanationInput" rows="2" placeholder="答案解析"></textarea>
                <button id="saveExerciseBtn">新增练习</button>
            </div>
            <div id="exerciseList" class="list compact"></div>
        </div>

        <div class="panel" id="plans">
            <div class="panel-title">
                <h2>学习计划</h2>
                <button id="createPlanBtn">生成计划</button>
            </div>
            <div id="planList" class="list"></div>
        </div>
    </section>

    <section class="workspace">
        <div class="panel">
            <div class="panel-title">
                <h2>知识库检索</h2>
                <button id="searchKnowledgeBtn">检索</button>
            </div>
            <label>关键词 <input id="knowledgeKeyword" type="text" value="Java"></label>
            <div class="admin-form">
                <input id="knowledgeTitleInput" type="text" placeholder="知识标题">
                <input id="knowledgeCategoryInput" type="text" placeholder="分类">
                <textarea id="knowledgeContentInput" rows="3" placeholder="知识内容"></textarea>
                <button id="saveKnowledgeBtn">新增知识</button>
            </div>
            <div id="knowledgeList" class="list"></div>
        </div>

        <div class="panel">
            <div class="panel-title">
                <h2>用户管理</h2>
                <button id="refreshUsersBtn">刷新</button>
            </div>
            <div class="admin-form">
                <input id="newUsernameInput" type="text" placeholder="用户名">
                <input id="newDisplayNameInput" type="text" placeholder="显示名称">
                <select id="newRoleInput">
                    <option value="LEARNER">学习者</option>
                    <option value="ADMIN">管理员</option>
                </select>
                <button id="createUserBtn">新增用户</button>
            </div>
            <div id="userList" class="list compact"></div>
        </div>
    </section>

    <section class="workspace">
        <div class="panel">
            <div class="panel-title">
                <h2>智能体配置</h2>
                <button id="refreshAgentsBtn">刷新</button>
            </div>
            <div class="admin-form">
                <input id="agentNameInput" type="text" placeholder="智能体名称">
                <input id="agentModelInput" type="text" placeholder="模型名称">
                <input id="agentTemperatureInput" type="number" min="0" max="1" step="0.1" value="0.5" placeholder="温度">
                <textarea id="agentResponsibilityInput" rows="2" placeholder="职责说明"></textarea>
                <button id="saveAgentConfigBtn">新增智能体</button>
            </div>
            <div id="agentConfigList" class="list compact"></div>
        </div>

        <div class="panel">
            <div class="panel-title">
                <h2>审计日志</h2>
                <button id="refreshAuditBtn">刷新</button>
            </div>
            <div id="auditLogList" class="list compact"></div>
        </div>
    </section>

    <section class="agent-panel">
        <div class="panel-title">
            <h2>多智能体问答</h2>
            <button id="askAgentBtn">提问</button>
        </div>
        <label>问题
            <textarea id="agentQuestion" rows="3">如何安排 Java Web 课程项目的学习？</textarea>
        </label>
        <div id="agentReply" class="agent-reply"></div>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
